        const chartW = width - left - right, chartH = height - top - bottom;
        const points = data.map((d,i)=>{
            const x = left + (chartW/(data.length-1))*i;
            const y = top + chartH - ((d[1]-min)/(max-min))*chartH;
            return {x,y,label:d[0],value:d[1]};
        });
        const linePath = points.reduce((path,p,i)=>{
            if(i===0) return `M ${p.x} ${p.y}`;
            const prev = points[i-1];
            const cx1 = prev.x + (p.x-prev.x) * 0.45;
            const cx2 = p.x - (p.x-prev.x) * 0.45;
            return `${path} C ${cx1} ${prev.y}, ${cx2} ${p.y}, ${p.x} ${p.y}`;
        },'');
        const areaPath = `${linePath} L ${points[points.length-1].x} ${top+chartH} L ${points[0].x} ${top+chartH} Z`;

            <div className="rounded-xl bg-white">

                    <path d={areaPath} fill={`url(#${fillId})`} />
                    <path d={linePath} fill="none" stroke="#2563eb" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round" />
                    {points.map((p,i)=>i%2===0||i===points.length-1?<text key={p.label} x={p.x} y={height-10} textAnchor="end" fontSize="12" fill="#64748b" transform={`rotate(-45 ${p.x} ${height-10})`}>{p.label}</text>:null)}

            </div>
        </div>
    );
    const DonutChart = ({ data }) => {
        const total = data.reduce((sum,item)=>sum+item.value,0);
        let start = 0;
        const segments = data.map(item=>{
            const end = start + item.value / total * 100;
            const seg = `${item.color} ${start}% ${end}%`;
            start = end;
            return seg;
        }).join(', ');
        return (
            <div className="flex items-center gap-5">
                <div className="relative w-36 h-36 flex-shrink-0 rounded-full shadow-inner" style={{background:`conic-gradient(${segments})`}}>
                    <div className="absolute inset-5 rounded-full bg-white flex flex-col items-center justify-center shadow-sm">

                    {data.map(item=><div key={item.name} className="grid grid-cols-[14px_1fr_auto] items-center gap-2 text-sm">

                        <span className="font-bold text-gray-900">{item.value} 件</span>

const App = () => {
    const [isLoggedIn, setIsLoggedIn] = useState(false);
    const [view, setView] = useState('square'); const [activeBu, setActiveBu] = useState(null); const [commonApp, setCommonApp] = useState(null); const [commonCheckTab, setCommonCheckTab] = useState('dashboard'); const [sysTab, setSysTab] = useState('用户管理'); const [configTab, setConfigTab] = useState('业务类型管理'); const [messages, setMessages] = useState([]); const [inputText, setInputText] = useState(''); const [selectedImage, setSelectedImage] = useState(null); const [isTyping, setIsTyping] = useState(false); const [isListening, setIsListening] = useState(false); const [videoReport, setVideoReport] = useState(null); const [docArchived, setDocArchived] = useState(false);
    const endRef = useRef(null);
    const [casesData, setCasesData] = useState(MOCK_CASES); const [inspData, setInspData] = useState(MOCK_INSPECTIONS);
    const [userProfile, setUserProfile] = useState({ name:'李四', role:'法制员', position:'支队管理员', phone:'138 0000 1234', avatar:null });
    useEffect(()=>{const hr=()=>{const w=window.innerWidth;if(w>=768&&w<=1440)document.documentElement.style.fontSize=`${Math.max(12,16*(w/1440))}px`;else document.documentElement.style.fontSize='16px';};window.addEventListener('resize',hr);hr();return()=>window.removeEventListener('resize',hr);},[]);
    useEffect(()=>{if((view==='chat'||view==='videoChat')&&endRef.current)endRef.current.scrollIntoView({behavior:"smooth"});},[messages,isTyping,view]);
    const imgChange=(e)=>{const f=e.target.files[0];if(f&&f.type.startsWith('image/')){const r=new FileReader();r.onload=(ev)=>setSelectedImage(ev.target.result);r.readAsDataURL(f);}e.target.value=null;};
    const rmImg=()=>setSelectedImage(null);

                        <div className="absolute bottom-0 w-full bg-gradient-to-t from-gray-50 via-gray-50 to-transparent pt-6 pb-6 px-4 md:px-8 pointer-events-none"><div className="max-w-4xl mx-auto pointer-events-auto"><form onSubmit={handleSend} className="relative bg-white border border-gray-300 shadow-lg rounded-2xl flex flex-col focus-within:ring-2 focus-within:ring-primary/50 transition-all">{selectedImage&&<div className="px-4 pt-3 pb-1 border-b border-gray-100"><div className="inline-block relative"><img src={selectedImage} alt="preview" className="h-16 w-16 object-cover rounded-lg border border-gray-200 shadow-sm" /><button type="button" onClick={rmImg} className="absolute -top-2 -right-2 bg-gray-800 text-white rounded-full hover:bg-red-500 w-5 h-5 flex items-center justify-center text-xs shadow">×</button></div></div>}<div className="flex items-end p-2"><button type="button" onClick={()=>switchView(view==='videoChat'?'video':'library')} className="p-3 text-gray-400 hover:text-primary flex-shrink-0" title="从材料库选择"><IconFolder /></button><label className="p-3 text-gray-400 hover:text-primary flex-shrink-0 cursor-pointer" title="上传图片"><IconImage /><input type="file" accept="image/*" className="hidden" onChange={imgChange} /></label><button type="button" onClick={startVoiceInput} className={`p-3 flex-shrink-0 rounded-xl transition-colors ${isListening?'text-white bg-primary animate-pulse':'text-gray-400 hover:text-primary'}`} title={isListening?'正在语音录入':'语音录入'}><IconMic /></button><textarea rows="1" className="w-full max-h-32 py-3 px-2 bg-transparent border-none focus:outline-none text-sm text-gray-800 resize-none" placeholder={isListening?'正在聆听，请说话...':'输入指令，或上传图片、材料...'} value={inputText} onChange={(e)=>setInputText(e.target.value)} onKeyDown={(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}}}></textarea><button type="submit" className={`p-3 m-1 rounded-xl flex-shrink-0 transition-colors ${(!isTyping&&(inputText.trim()||selectedImage))?'bg-primary text-white hover:bg-blue-800':'bg-gray-100 text-gray-400'}`} disabled={isTyping||(!inputText.trim()&&!selectedImage)}><IconSend /></button></div></form><div className="text-center mt-2 text-xs text-gray-400 bg-gray-50/80 backdrop-blur rounded p-1">大语言模型生成内容仅供法制复核参考，请以人工确认为准</div></div></div>
                    </div>
                )}
            </div>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
